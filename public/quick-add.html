<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>cabinet. — Image Admin</title>
<script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
<style>
  :root {
    --ivory: #FAF8F5;
    --espresso: #1C1916;
    --muted: #6B6459;
    --line: #E8E2D9;
    --wine: #8B3A4A;
    --accent: #8B6F47;
    --good: #4A7C59;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--ivory);
    color: var(--espresso);
    padding: 24px;
    max-width: 900px;
    margin: 0 auto;
  }
  h1 { font-family: Palatino, "Palatino Linotype", Georgia, serif; font-weight: 400; font-size: 28px; margin-bottom: 4px; }
  h1 .dot { color: var(--wine); }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .controls { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
  .stat { font-size: 13px; color: var(--muted); }
  .stat b { color: var(--espresso); }
  button.filter {
    background: none; border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 14px; cursor: pointer; font-size: 13px; color: var(--muted);
  }
  button.filter.active { background: var(--espresso); color: #fff; border-color: var(--espresso); }
  .row {
    display: flex; align-items: center; gap: 16px; padding: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px;
  }
  .thumb {
    width: 60px; height: 60px; border-radius: 8px; flex-shrink: 0;
    background: var(--ivory); border: 1px solid var(--line);
    object-fit: cover; display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--muted); text-align: center;
  }
  .info { flex: 1; min-width: 0; }
  .brand { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  .line { font-size: 14px; font-weight: 500; }
  .cat { font-size: 11px; color: var(--muted); }
  .status { font-size: 11px; padding: 2px 8px; border-radius: 4px; flex-shrink: 0; }
  .status.has { background: #F2F8F4; color: var(--good); }
  .status.missing { background: #FDF2F0; color: #C0392B; }
  button.upload {
    background: var(--accent); color: #fff; border: none; border-radius: 6px;
    padding: 8px 16px; cursor: pointer; font-size: 13px; flex-shrink: 0;
  }
  button.upload:hover { opacity: 0.9; }
  .loading { text-align: center; padding: 40px; color: var(--muted); }
</style>
</head>
<body>
  <h1>cabinet<span class="dot">.</span> Image Admin</h1>
  <div class="sub">Upload product images. Saves straight to your catalog.</div>

  <div class="controls">
    <button class="filter active" data-filter="all">All</button>
    <button class="filter" data-filter="missing">Missing only</button>
    <span class="stat" id="stat"></span>
  </div>

  <div id="list"><div class="loading">Loading products…</div></div>

<script>
  const SECRET = new URLSearchParams(location.search).get("secret") || "cabinet";
  const CLOUD_NAME = "dp2r3kmwk";
  const UPLOAD_PRESET = "cabinet-admin-upload";
  const API = "/api/save-image?secret=" + SECRET;

  let products = [];
  let filter = "all";

  function isMissing(p) {
    return !p.image_url || p.image_url === "NEEDS_MANUAL_IMAGE" || p.image_url.includes("sephora.com");
  }

  async function load() {
    const r = await fetch(API);
    const data = await r.json();
    products = data.products || [];
    render();
  }

  function render() {
    const list = document.getElementById("list");
    const shown = products.filter(p => filter === "all" || isMissing(p));
    const missingCount = products.filter(isMissing).length;
    document.getElementById("stat").innerHTML =
      `<b>${products.length}</b> products · <b>${missingCount}</b> still need a good image`;

    if (shown.length === 0) {
      list.innerHTML = '<div class="loading">Nothing here 🎉</div>';
      return;
    }

    list.innerHTML = shown.map(p => {
      const missing = isMissing(p);
      const thumb = (p.image_url && !missing)
        ? `<img class="thumb" src="${p.image_url}" alt="" />`
        : `<div class="thumb">no img</div>`;
      return `
        <div class="row" data-id="${p.id}">
          ${thumb}
          <div class="info">
            <div class="brand">${p.brand}</div>
            <div class="line">${p.line}</div>
            <div class="cat">${p.category}</div>
          </div>
          <span class="status ${missing ? "missing" : "has"}">${missing ? "needs image" : "has image"}</span>
          <button class="upload" data-id="${p.id}">Upload</button>
        </div>`;
    }).join("");

    document.querySelectorAll("button.upload").forEach(btn => {
      btn.onclick = () => openWidget(btn.dataset.id);
    });
  }

  function openWidget(productId) {
    const widget = cloudinary.createUploadWidget({
      cloudName: CLOUD_NAME,
      uploadPreset: UPLOAD_PRESET,
      folder: "cabinet-products",
      sources: ["local", "url", "camera"],
      multiple: false,
      cropping: false,
      maxImageWidth: 800,
    }, async (error, result) => {
      if (!error && result && result.event === "success") {
        const imageUrl = result.info.secure_url;
        await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ secret: SECRET, productId, imageUrl }),
        });
        const p = products.find(x => x.id === productId);
        if (p) p.image_url = imageUrl;
        render();
      }
    });
    widget.open();
  }

  document.querySelectorAll("button.filter").forEach(btn => {
    btn.onclick = () => {
      filter = btn.dataset.filter;
      document.querySelectorAll("button.filter").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      render();
    };
  });

  load();
</script>
</body>
</html>
